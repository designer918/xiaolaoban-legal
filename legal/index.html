<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>小老板精灵 - 法律声明</title>
    <style>
      :root {
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --card: #f9fafb;
        --border: #e5e7eb;
        --link: #2563eb;
        --maxw: 720px;
        --radius: 10px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --fg: #e5e7eb;
          --muted: #94a3b8;
          --card: #0f172a;
          --border: #1f2937;
          --link: #60a5fa;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC",
          "Helvetica Neue", Arial, sans-serif;
      }
      .wrap {
        max-width: var(--maxw);
        margin: 0 auto;
        padding: 28px 16px 64px;
      }
      .card {
        border: 1px solid var(--border);
        background: var(--card);
        border-radius: var(--radius);
        padding: 16px;
      }
      h1 {
        margin: 8px 0 12px;
        font-size: 24px;
      }
      a {
        color: var(--link);
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      ul {
        margin: 10px 0 0 18px;
        padding: 0;
      }
      li {
        margin: 8px 0;
      }
      .muted {
        color: var(--muted);
        font-size: 13px;
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <h1>小老板精灵 - 法律声明</h1>
        <p>以下链接可用于 AppGallery Connect 上架资料填写：</p>
        <ul>

          <li><a href="./user-agreement.html">用户协议</a></li>
        </ul>
        <p class="muted">更新时间：2026-05-03</p>
      </div>
    </div>
  </body>
</html>
